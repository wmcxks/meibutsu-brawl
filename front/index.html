<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meibutsu Brawl（名物大乱斗）</title>
    <!-- 首屏加载动画样式（独立文件，替换此文件即可更换加载效果） -->
    <link rel="stylesheet" href="/loader.css" />
  </head>
  <body>
    <!--
      原生首屏幕布：遮挡 HTML 未样式化闪烁与资源加载过程。
      覆盖全屏、深黑底、极高 z-index；Phaser 就绪后由 main.ts 移除。
      内部是 /loader.css 驱动的 3D 盒子加载动画。
    -->
    <div
      id="global-loading-mask"
      style="position: fixed; inset: 0; z-index: 99999; background: #111111; display: flex; align-items: center; justify-content: center;"
    >
      <div class="loader">
        <div class="ground"><div></div></div>
        <div class="box box0"><div></div></div>
        <div class="box box1"><div></div></div>
        <div class="box box2"><div></div></div>
        <div class="box box3"><div></div></div>
        <div class="box box4"><div></div></div>
        <div class="box box5"><div></div></div>
        <div class="box box6"><div></div></div>
        <div class="box box7"><div></div></div>
      </div>
    </div>

    <!--
      DOM 垫底背景层：旋转几何渐变（纯 CSS，GPU 合成器驱动，零 WebGL 开销）。
      样式见 src/style.css 中 #bg-container / ::before。
    -->
    <div id="bg-container"></div>

    <!-- Phaser canvas mount point: full-viewport so Scale.FIT fills the screen -->
    <div id="app" class="fixed inset-0 overflow-hidden"></div>

    <!-- HTML UI overlay (Alpine.js + TailwindCSS) above the canvas -->
    <div id="ui-layer" x-data="gameUI" class="pointer-events-none fixed inset-0 z-50">
      <!--
        ui-container：720 宽、高度随设备动态(1280~1600)的容器。
        高度由 src/core/uiScaler.ts 按与 Phaser 画布一致的 designH 写死，
        实际缩放同 Phaser Scale.FIT。内部元素统一使用设计稿像素/百分比。
      -->
      <div id="ui-container" class="pointer-events-none absolute left-1/2 top-1/2 w-[720px]">
      <!-- 游戏内 HUD：右上角按钮组 + 底部道具栏（转场期间隐藏，避免悬浮在遮罩上） -->
      <div x-show="!isTransitioning" class="pointer-events-none absolute inset-0 [container-type:size]">
        <!-- 右上角按钮组：排行榜 / 我的资料 / 静音 -->
        <div class="pointer-events-auto absolute right-4 top-4 flex gap-[2.5cqw]">
          <button
            @click="showLeaderboard('national')"
            class="flex h-[9cqw] w-[9cqw] cursor-pointer items-center justify-center rounded-full border-none bg-black/40 text-[4.6cqw]"
            style="line-height:1;"
            aria-label="ランキング"
          >🏆</button>
          <button
            @click="openMissions()"
            class="flex h-[9cqw] w-[9cqw] cursor-pointer items-center justify-center rounded-full border-none bg-black/40 text-[4.2cqw]"
            style="line-height:1;"
            aria-label="ミッション"
          >📋</button>
          <button
            @click="openShop()"
            class="flex h-[9cqw] w-[9cqw] cursor-pointer items-center justify-center rounded-full border-none bg-black/40 text-[4.2cqw]"
            style="line-height:1;"
            aria-label="ショップ"
          >🛍️</button>
          <button
            @click="openProfile()"
            class="flex h-[9cqw] w-[9cqw] cursor-pointer items-center justify-center rounded-full border-none bg-black/40 text-[4.2cqw]"
            style="line-height:1;"
            aria-label="プロフィール"
          >👤</button>
          <button
            @click="toggleSound(isSoundOn)"
            class="flex h-[9cqw] w-[9cqw] cursor-pointer items-center justify-center rounded-full border-none bg-black/40 text-[3.6cqw] font-bold text-white"
            style="line-height:1;"
            x-text="isSoundOn ? '🔊' : '🔇'"
            :aria-label="isSoundOn ? 'ミュート' : 'ミュート解除'"
          ></button>
        </div>
        <!-- 底部道具栏（原 props.js 复刻：移出/撤回/洗牌/透视，0 次罩灰 + 右上角角标） -->
        <div class="pointer-events-auto absolute left-1/2 top-[90%] flex -translate-x-1/2 gap-[5cqw]">
          <template x-for="(icon, i) in propIcons" :key="icon">
            <button
              @click="useProp(i)"
              :class="propCounts[i] <= 0 ? 'opacity-40 grayscale' : ''"
              class="relative h-[16cqw] w-[16cqw] cursor-pointer overflow-hidden rounded-[10px] border-none p-0"
            >
              <img :src="'/images/game/props/' + icon + '.png'" class="h-full w-full object-cover" alt="">
              <span
                x-show="propCounts[i] > 0"
                class="absolute -top-[1.2cqw] -right-[1.2cqw] flex h-[5.7cqw] min-w-[5.7cqw] items-center justify-center rounded-full bg-[#ff5252] px-[1cqw] text-[3.6cqw] font-bold text-white"
                x-text="propCounts[i]"
              ></span>
            </button>
          </template>
        </div>
      </div>

      <!-- 网络异常弹窗（开局会话快速失败时弹出，可手动重连） -->
      <div
        x-show="isNetworkError"
        class="pointer-events-auto absolute inset-0 z-20 flex items-center justify-center bg-black/40"
      >
        <div class="w-[70%] max-w-[400px] rounded-[14px] bg-white p-6 text-center font-sans">
          <p class="m-0 mb-5 text-[15px] text-[#555]">ネットワークエラー。ステージの読み込みに失敗しました。通信環境を確認して、もう一度お試しください。</p>
          <button @click="retryConnection" class="w-full cursor-pointer rounded-[10px] bg-[#e8b33d] py-3 text-base font-bold text-white">再接続</button>
        </div>
      </div>

      <!-- Toast 提示（转场期间隐藏） -->
      <div
        x-show="toastVisible && !isTransitioning"
        x-transition.opacity
        class="pointer-events-none absolute left-1/2 top-[55%] z-10 -translate-x-1/2 rounded-lg bg-black/70 px-4 py-2 text-sm text-white"
        x-text="toastText"
      ></div>

      <!-- 复活弹窗（原 revive.js 1:1 复刻：遮罩 0.6 黑底 + 75%x35% 白底圆角 + 双按钮） -->
      <div
        x-show="isReviveVisible"
        class="absolute inset-0 flex items-center justify-center bg-black/60 font-sans [container-type:size] pointer-events-auto"
      >
        <div class="relative w-[75cqw] h-[35cqh] bg-white rounded-[2.22cqw]">
          <p class="absolute top-[22%] left-0 m-0 w-full -translate-y-1/2 text-center text-[6.5cqw] font-bold text-[#e17055]">スロットがいっぱい！</p>
          <p class="absolute top-[44%] left-0 m-0 w-full -translate-y-1/2 text-center text-[3.8cqw] text-[#666]">復活しますか？</p>
          <button
            @click="cancelRevive"
            class="absolute top-[70%] left-[8%] h-[18%] w-[38%] cursor-pointer rounded-[1.11cqw] border-none bg-[#e0e0e0] text-[3.5cqw] font-bold text-[#333]"
          >復活しない</button>
          <button
            @click="handleRevive"
            class="absolute top-[70%] left-[54%] h-[18%] w-[38%] cursor-pointer rounded-[1.11cqw] border-none bg-[#00b894] text-[3.5cqw] font-bold text-white"
          >復活する</button>
        </div>
      </div>

      <!-- 游戏结束（失败）弹窗 -->
      <div
        x-show="isGameOver"
        class="pointer-events-auto absolute inset-0 flex items-center justify-center bg-black/55"
      >
        <div class="w-[72%] max-w-[420px] rounded-[14px] bg-white p-7 text-center font-sans">
          <h2 class="m-0 mb-2 text-[22px] font-bold text-[#7a5c1e]">ゲームオーバー</h2>
          <p class="m-0 mb-5 text-[15px] text-[#555]">スロットがいっぱいになり、ステージクリアに失敗しました。もう一度挑戦しますか？</p>
          <button @click="restartGame" class="w-full cursor-pointer rounded-[10px] bg-[#e8b33d] py-3 text-base font-bold text-white">もう一度挑戦</button>
          <button @click="showLeaderboard" class="mt-2.5 w-full cursor-pointer rounded-[10px] border border-[#e8b33d] bg-white py-3 text-base font-bold text-[#b8860b]">ランキングを見る</button>
        </div>
      </div>

      <!-- 排行榜面板（全国 / 我的区域 切换 + 我的名次） -->
      <div
        x-show="leaderboardVisible"
        class="pointer-events-auto absolute inset-0 flex items-center justify-center bg-black/60"
      >
        <div class="flex max-h-[75%] w-[82%] max-w-[460px] flex-col rounded-[14px] bg-white p-5 text-center font-sans">
          <h2 class="m-0 mb-3 text-[20px] font-bold text-[#7a5c1e]">ランキング（最速クリア）</h2>
          <!-- 维度切换 -->
          <div class="mb-3 flex justify-center gap-2 text-sm font-bold">
            <button
              @click="setRankScope('national')"
              :class="rankScope === 'national' ? 'bg-[#e8b33d] text-white' : 'bg-[#eee] text-[#777]'"
              class="cursor-pointer rounded-full border-none px-5 py-1.5"
            >全国</button>
            <button
              @click="setRankScope('my')"
              :disabled="!rankScopeReady"
              :class="rankScope === 'my' && rankScopeReady ? 'bg-[#e8b33d] text-white' : 'bg-[#eee] text-[#777]'"
              class="cursor-pointer rounded-full border-none px-5 py-1.5 disabled:cursor-not-allowed"
              x-text="rankScopeReady ? ('マイ地域' + (me ? '（' + regionName(me.user.region_code) + '）' : '')) : 'マイ地域（未設定）'"
            ></button>
          </div>
          <ul class="m-0 mb-4 list-none flex-1 overflow-y-auto p-0">
            <template x-for="(item, idx) in leaderboard" :key="idx">
              <li class="flex justify-between border-b border-[#eee] px-1 py-2 text-sm text-[#444]">
                <span><span x-text="item.rank"></span>. <span x-text="item.nickname"></span></span>
                <span class="font-bold text-[#d89b2e]" x-text="formatTime(item.best_time)"></span>
              </li>
            </template>
          </ul>
          <div x-show="leaderboard.length === 0" class="py-2 text-sm text-[#999]">クリア記録はまだありません</div>
          <div x-show="myRank" class="mb-3 text-sm font-bold text-[#7a5c1e]">
            あなたの順位：<span x-text="myRank"></span>位
          </div>
          <button @click="closeLeaderboard" class="w-full cursor-pointer rounded-[10px] bg-[#e8b33d] py-3 text-base font-bold text-white">閉じる</button>
        </div>
      </div>

      <!-- 我的资料面板（昵称 / 区域 / 注销） -->
      <div
        x-show="profileOpen"
        class="pointer-events-auto absolute inset-0 flex items-center justify-center bg-black/60 font-sans"
      >
        <div class="w-[80%] max-w-[440px] rounded-[14px] bg-white p-6 text-center">
          <h2 class="m-0 mb-4 text-[20px] font-bold text-[#7a5c1e]">プロフィール</h2>
          <p class="m-0 mb-2 text-left text-[13px] text-[#888]">ニックネーム</p>
          <input
            x-model="profileNickname"
            maxlength="32"
            class="mb-4 w-full rounded-[10px] border border-[#ddd] px-3 py-2.5 text-base outline-none focus:border-[#e8b33d]"
            placeholder="ニックネーム"
          />
          <p class="m-0 mb-2 text-left text-[13px] text-[#888]">都道府県（地域ランキング）</p>
          <select x-model="profileRegion" class="mb-5 w-full rounded-[10px] border border-[#ddd] bg-white px-3 py-2.5 text-base outline-none">
            <option value="">選択しない</option>
            <template x-for="p in prefectures" :key="p.code">
              <option :value="p.code" x-text="p.name"></option>
            </template>
          </select>
          <button
            @click="saveProfile()"
            :disabled="profileSaving"
            class="w-full cursor-pointer rounded-[10px] bg-[#e8b33d] py-3 text-base font-bold text-white disabled:opacity-50"
            x-text="profileSaving ? '保存中...' : '保存する'"
          ></button>
          <div class="mt-4">
            <button @click="requestDeleteAccount()" class="cursor-pointer border-none bg-transparent text-[13px] text-[#e17055] underline">アカウントを削除</button>
          </div>
          <button @click="profileOpen = false" class="mt-2 w-full cursor-pointer rounded-[10px] border border-[#ddd] bg-white py-2.5 text-sm font-bold text-[#666]">閉じる</button>
        </div>
      </div>

      <!-- 任务面板（每日 / 每周 / 成就） -->
      <div
        x-show="missionsOpen"
        class="pointer-events-auto absolute inset-0 flex items-center justify-center bg-black/60 font-sans"
      >
        <div class="flex max-h-[78%] w-[86%] max-w-[460px] flex-col rounded-[14px] bg-white p-5 text-center">
          <h2 class="m-0 mb-3 text-[20px] font-bold text-[#7a5c1e]">ミッション</h2>
          <!-- 周期切换 -->
          <div class="mb-3 flex justify-center gap-2 text-sm font-bold">
            <button
              @click="setMissionsScope('daily')"
              :class="missionsScope === 'daily' ? 'bg-[#e8b33d] text-white' : 'bg-[#eee] text-[#777]'"
              class="cursor-pointer rounded-full border-none px-4 py-1.5"
            >毎日</button>
            <button
              @click="setMissionsScope('weekly')"
              :class="missionsScope === 'weekly' ? 'bg-[#e8b33d] text-white' : 'bg-[#eee] text-[#777]'"
              class="cursor-pointer rounded-full border-none px-4 py-1.5"
            >今週</button>
            <button
              @click="setMissionsScope('achievement')"
              :class="missionsScope === 'achievement' ? 'bg-[#e8b33d] text-white' : 'bg-[#eee] text-[#777]'"
              class="cursor-pointer rounded-full border-none px-4 py-1.5"
            >実績</button>
          </div>
          <ul class="m-0 mb-4 list-none flex-1 overflow-y-auto p-0">
            <template x-for="m in missions" :key="m.mission_key">
              <li class="mb-2 flex items-center justify-between rounded-[10px] bg-[#faf7f0] px-3 py-2.5">
                <div class="text-left">
                  <p class="m-0 text-[14px] font-bold text-[#444]" x-text="m.title"></p>
                  <p class="m-0 mt-0.5 text-[12px] text-[#999]">
                    進捗 <span x-text="Math.min(m.progress, m.target_value) + ' / ' + m.target_value"></span>
                  </p>
                  <p class="m-0 mt-0.5 text-[12px] text-[#d89b2e]" x-text="'報酬：' + rewardName(m.reward_prop_key) + ' ×' + m.reward_amount"></p>
                </div>
                <button
                  @click="claimMissionItem(m)"
                  :disabled="!m.completed || m.claimed"
                  :class="m.claimed ? 'bg-[#ccc]' : (m.completed ? 'bg-[#00b894]' : 'bg-[#ccc]')"
                  class="ml-2 shrink-0 cursor-pointer rounded-full border-none px-4 py-2 text-[13px] font-bold text-white disabled:cursor-not-allowed"
                  x-text="m.claimed ? '済み' : (m.completed ? '受け取る' : '未達成')"
                ></button>
              </li>
            </template>
          </ul>
          <div x-show="!missionsLoading && missions.length === 0" class="py-2 text-sm text-[#999]">ミッションはありません</div>
          <button @click="missionsOpen = false" class="w-full cursor-pointer rounded-[10px] bg-[#e8b33d] py-3 text-base font-bold text-white">閉じる</button>
        </div>
      </div>

      <!-- 商店面板（支付渠道接入前的占位流程） -->
      <div
        x-show="shopOpen"
        class="pointer-events-auto absolute inset-0 flex items-center justify-center bg-black/60 font-sans"
      >
        <div class="flex max-h-[75%] w-[84%] max-w-[440px] flex-col rounded-[14px] bg-white p-5 text-center">
          <h2 class="m-0 mb-3 text-[20px] font-bold text-[#7a5c1e]">ショップ</h2>
          <div class="mb-2 flex justify-end">
            <button @click="cancelPendingOrder()" class="cursor-pointer border-none bg-transparent text-[12px] text-[#999] underline">未完了の注文をキャンセル</button>
          </div>
          <ul class="m-0 mb-4 list-none flex-1 overflow-y-auto p-0">
            <template x-for="p in shopProducts" :key="p.sku">
              <li class="mb-2 flex items-center justify-between rounded-[10px] bg-[#faf7f0] px-3 py-3">
                <div class="text-left">
                  <p class="m-0 text-[15px] font-bold text-[#444]" x-text="p.name"></p>
                  <p class="m-0 mt-0.5 text-[12px] text-[#999]" x-text="'保有通貨：' + currencyName(p.currency)"></p>
                </div>
                <button
                  @click="buyProduct(p)"
                  :disabled="shopBuying"
                  class="ml-2 shrink-0 cursor-pointer rounded-full border-none bg-[#e8b33d] px-5 py-2.5 text-[14px] font-bold text-white disabled:opacity-50"
                >注文</button>
              </li>
            </template>
          </ul>
          <div x-show="shopProducts.length === 0" class="py-2 text-sm text-[#999]">準備中です</div>
          <button @click="shopOpen = false" class="w-full cursor-pointer rounded-[10px] bg-[#e8b33d] py-3 text-base font-bold text-white">閉じる</button>
        </div>
      </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
