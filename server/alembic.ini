# Alembic 配置
# 数据库 URL 不在此配置：env.py 读取 server/.env（与 app 同一 Settings）
[alembic]
script_location = alembic
prepend_sys_path = .

# 日志交给应用自身处理（env.py 不启用 fileConfig）
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
