name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 v0.2.0，会执行 deploy）"
        required: false
        type: string
      platform:
        description: "发布目标平台"
        required: false
        default: "web"
        type: choice
        options: [web, line]

jobs:
  server-check:
    name: server (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r server/requirements.txt

      - name: Compile check
        run: |
          cd server
          python -m compileall -q app config.py main.py alembic ../scripts/ops_check.py ../scripts/bench_load.py ../scripts/migrate_remote.py

      - name: Unit tests (offline)
        run: |
          cd server
          python -m pytest tests/test_payments.py -q

  client-build:
    name: client (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install
        run: npm ci
        working-directory: front

      - name: Build
        run: npm run build
        working-directory: front

  deploy:
    name: deploy (H3 一键发布，仅手动触发)
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    needs: [server-check, client-build]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      # deploy_web.sh 从 server/.env 读 OSS 配置 → 从 Secrets 生成
      - name: Write server/.env (from secrets)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET_NAME: ${{ secrets.OSS_BUCKET_NAME }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          cat > server/.env <<EOF
          OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
          OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
          OSS_BUCKET_NAME=${OSS_BUCKET_NAME}
          OSS_ENDPOINT=${OSS_ENDPOINT}
          EOF

      - name: Deploy (build + OSS upload + latest_url)
        env:
          VITE_TARGET_PLATFORM: ${{ inputs.platform }}
          VITE_LIFF_ID: ${{ secrets.VITE_LIFF_ID }}
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          ./scripts/deploy_web.sh ${{ inputs.version }}
